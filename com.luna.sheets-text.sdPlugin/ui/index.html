<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Sheets Text</title><link rel="stylesheet" href="https://sdpi-components.dev/releases/v3/sdpi.css"><script src="https://sdpi-components.dev/releases/v3/sdpi.js"></script></head><body><sdpi-item label="URL CSV publiée"><sdpi-textfield setting="csvUrl" placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv"></sdpi-textfield></sdpi-item><sdpi-item label="Mode"><sdpi-select setting="mode"><option value="lookup">Recherche par ID + langue (A/B → C)</option><option value="cell">Cellule directe</option></sdpi-select></sdpi-item><sdpi-item label="ID (colonne A)"><sdpi-textfield setting="id" placeholder="Bienvenue"></sdpi-textfield></sdpi-item><sdpi-item label="Langue (colonne B)"><sdpi-textfield setting="language" placeholder="Fra"></sdpi-textfield></sdpi-item><sdpi-item label="Cellule (mode direct)"><sdpi-textfield setting="cell" placeholder="C2"></sdpi-textfield></sdpi-item><sdpi-item label="Actualisation (secondes)"><sdpi-textfield setting="refreshSeconds" value="15" placeholder="15"></sdpi-textfield></sdpi-item><sdpi-item label="À savoir"><div>Le texte est copié puis collé dans la fenêtre active. Publiez la feuille en CSV ; toute personne disposant de l’URL peut lire son contenu.</div></sdpi-item></body></html>
