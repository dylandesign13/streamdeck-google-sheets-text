name: Build Stream Deck plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-plugin
          path: dist/*.streamDeckPlugin
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dernière version du plugin
          files: dist/*.streamDeckPlugin
